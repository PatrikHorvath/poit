services:
  flask-apps:
    container_name: flask-instance
    build:
      context: ./flask
      dockerfile: Dockerfile
    volumes:
      - ./flask/instances:/app/instances
    restart: unless-stopped
    depends_on:
      - mysql-db
    networks:
      - web-network

  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin:5.2.3
    restart: unless-stopped
    depends_on:
      - mysql-db
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=mysql-db
      - PMA_ARBITRARY=0
      - MYSQL_ROOT_PASSWORD=${SQL_ROOT_PWD}
    networks:
      - web-network

  mysql-db:
    container_name: mysql-db
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SQL_ROOT_PWD}
      MYSQL_DATABASE: flask_db
      MYSQL_USER: flask
      MYSQL_PASSWORD: ${SQL_FLASK_PWD}
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - web-network

networks:
  web-network:
    driver: bridge
