<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teplotný Dashboard</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Teplotný Dashboard</h1>

      <!-- Stav zariadenia -->
      <div class="card">
        <h2>Stav systému</h2>
        <div id="device-status">
          <div class="status-indicator">
            <span class="status-label">Pripojenie:</span>
            <span
              id="connection-status"
              class="status-badge status-disconnected"
              >Nepripojené</span
            >
          </div>
          <div class="status-indicator">
            <span class="status-label">Stav systému:</span>
            <span id="system-status" class="status-badge status-off"
              >Vypnutý</span
            >
          </div>
        </div>
      </div>

      <!-- Ovládanie systému -->
      <div class="card" id="control-card">
        <h2>Ovládanie systému</h2>
        <div class="control-buttons">
          <button
            id="btn-power-on"
            class="btn btn-success"
            onclick="controlSystem('on')"
          >
            ZAPNÚŤ SYSTÉM
          </button>
          <button
            id="btn-power-off"
            class="btn btn-danger"
            onclick="controlSystem('off')"
            disabled
          >
            VYPNÚŤ SYSTÉM
          </button>

          <button
            id="btn-disconnect"
            class="btn btn-light-danger"
            onclick="disconnectSocket()"
          >
            UKONČIŤ SPOJENIE
          </button>



        </div>

        <hr />

        <div class="monitoring-controls">
          <button
            id="btn-start-monitor"
            class="btn btn-primary"
            onclick="startMonitoring()"
          >
            SLEDOVAŤ
          </button>
          <button
            id="btn-stop-monitor"
            class="btn btn-secondary"
            onclick="stopMonitoring()"
            disabled
          >
            ZRUŠIŤ SLEDOVANIE
          </button>
        </div>
        
        <div class="setpoint-controls">
          <h3>Želaná hodnota</h3>
          <div class="filter-group" style="margin-top: 10px">
            <label for="setpoint-input">Želaná teplota (°C):</label>
            <input
              type="number"
              id="setpoint-input"
              min="0"
              max="50"
              step="0.1"
              value="25"
              style="width: 80px"
            />
            <button class="btn-filter" onclick="sendSetpoint()">
              Nastaviť
            </button>
          </div>
        </div>



        <div id="debug-control-panel" style="display: none">
          <hr />
          <h3>Debug Možnosti</h3>
          <div class="filter-group" style="margin-top: 10px">
            <label for="debug-pwm-input">Manuálne Peltier PWM (%):</label>
            <input
              type="number"
              id="debug-pwm-input"
              min="0"
              max="100"
              value="0"
              style="width: 80px"
            />
            <button class="btn-filter" onclick="sendDebugPwm()">
              Nastaviť PWM
            </button>
          </div>
        </div>
      </div>

      <!-- ============ LIVE MONITORING PANEL ============ -->
      <div id="monitoring-panel" class="card" style="display: none">
        <h2>Live monitoring</h2>
        <div class="live-status">
          <span class="status-badge monitoring-active">SLEDUJE SA</span>
          <div class="live-data">
            <div class="live-temp">
              Meraná teplota: <strong id="last-temp">--</strong> °C
            </div>
            <div class="live-time">Čas: <strong id="last-time">--</strong></div>
          </div>
        </div>

        <div class="view-switch" id="live-view-switch" style="display: none">
          <button
            class="view-btn active"
            onclick="switchLiveView('chart', event)"
          >
            Graf
          </button>
          <button class="view-btn" onclick="switchLiveView('table', event)">
            Tabuľka
          </button>
          <button class="view-btn" onclick="switchLiveView('gauge', event)">
            Gauge
          </button>
        </div>

        <!-- Live Graf -->
        <div id="live-chart-view" class="view-content">
          <canvas id="live-temperature-chart"></canvas>
        </div>

        <!-- Live Tabuľka -->
        <div id="live-table-view" class="view-content" style="display: none">
          <div id="live-temperature-table" class="table-container"></div>
        </div>

        <!-- Live Gauge -->
        <div id="live-gauge-view" class="view-content" style="display: none">
          <div class="gauges-container" id="live-gauges-container"></div>
        </div>
      </div>

      <!-- ============ HISTORIC DATA VISUALIZATION ============ -->
      <div class="card">
        <h2>Vizualizácia historických dát</h2>

        <!-- Filtre -->
        <div class="filter-controls">
          <div class="filter-group">
            <label>Rýchle filtre:</label>
            <button class="btn-filter" onclick="loadDataForPeriod('hour')">
              Posledná hodina
            </button>
            <button class="btn-filter" onclick="loadDataForPeriod('4h')">
              4 hodiny
            </button>
            <button class="btn-filter" onclick="loadDataForPeriod('8h')">
              8 hodín
            </button>
            <button class="btn-filter" onclick="loadDataForPeriod('session')">
              Posledné spustenie
            </button>
          </div>

          <div class="filter-group">
            <label>Vlastný rozsah:</label>
            <input type="datetime-local" id="custom-from" />
            <span>→</span>
            <input type="datetime-local" id="custom-to" />
            <button class="btn-filter" onclick="loadDataForPeriod('custom')">
              Načítať
            </button>
          </div>
        </div>

        <div
          id="history-no-data-message"
          class="alert alert-info"
          style="margin-top: 15px"
        >
          Zvoľte časové obdobie a kliknutím na filter načítajte historické dáta.
        </div>

        <div class="view-switch" id="history-view-switch" style="display: none">
          <button
            class="view-btn active"
            onclick="switchHistoryView('chart', event)"
          >
            Graf
          </button>
          <button class="view-btn" onclick="switchHistoryView('table', event)">
            Tabuľka
          </button>
          <button
            id="btn-download-history"
            class="btn-filter"
            onclick="downloadHistoryDataJSON()"
          >
            Stiahnuť JSON
          </button>
        </div>

        <div id="history-views-container" style="display: none">
          <div id="history-chart-view" class="view-content">
            <div class="history-chart-container">
              <canvas id="temperature-chart"></canvas>
            </div>
          </div>

          <div
            id="history-table-view"
            class="view-content"
            style="display: none"
          >
            <div id="temperature-table" class="table-container"></div>
          </div>
        </div>

        <div id="statistics" class="statistics"></div>
      </div>
    </div>
    <script src="/static/script.js"></script>
  </body>
</html>
